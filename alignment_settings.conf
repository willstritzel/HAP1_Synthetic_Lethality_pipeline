####################################################
Settings file for haploid enrichment screen scripts
####################################################
# Author: Elmer Stickel
# Version: 1.1, October 2017
####################################################
Description:
All parameters are tab separated. Don't edit the name of the parameter nor the name of the section headers!



# Genome alignment and mapping settings
#########################################################################################################
Parameter	value   description
---------------------------------------
ref_genome:	/pl/active/ShenLab_PL/haploid_genetics/reference/GCA_000001405.15_GRCh38_genomic_bowtie	# path to directory incl. invariable part of file name
gene_ref	/pl/active/ShenLab_PL/haploid_genetics/reference/annotation/GRCh38_introns_CM_mapped.bed
ref_id	GRCh38-NCBI_RefSeq
trim_reads:	yes	# 'yes' or 'no'
keep_reads_from:	0	# from which base should the reads be kept? (0 for beginning of read)
desired_read_length:	50	# new read length
mismatch_num:	1	# Number of mismatches allowed, cannot be more the 1


# System Settings
######################################################################################################
Parameter	value   description
---------------------------------------
location_bowtie	/projects/wist9668/software/anaconda/envs/hap1/bin/bowtie
core_num:	16			# Desired number of CPU cores to be used
memory_limit:	60G	        				# Amount of RAM available for analysis
tmp_dir:	/scratch/alpine/wist9668/haploid_scratch/tmp/	# Please end with a slash!
final_dir:	/scratch/alpine/wist9668/haploid_scratch/screens/	# To which directory should the files be written to if the analysis is done (please put a / behind it!)
